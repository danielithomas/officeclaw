# ============================================
# OFFICECLAW - CI Testing Pipeline
# ============================================
# Runs on every push and pull request
# Tests across Python versions, runs linting, security checks
# ============================================

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  # ============================================
  # LINTING & FORMATTING
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked installs exactly what uv.lock pins. Formatting and type
        # results are version-sensitive, so `pip install black mypy` would fail
        # this job the day either tool makes a new release — a red build nobody
        # caused. Bump the versions deliberately with `uv lock --upgrade`.
        run: uv sync --locked --extra dev

      - name: Check formatting with Black
        run: uv run black --check --diff src/ tests/

      - name: Lint with Ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/officeclaw/ --ignore-missing-imports

  # ============================================
  # SECURITY AUDIT
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # Installs the project as well as its dependencies, so pip-audit sees
        # the tree officeclaw actually resolves to rather than its own.
        run: uv sync --locked --extra dev

      - name: Audit dependencies with pip-audit
        # Fails the build on any known vulnerability in the locked dependency
        # tree — including one published after this commit, which is the point:
        # the fix is `uv lock --upgrade`. To accept a specific advisory, add an
        # explicit --ignore-vuln <ID> here with a comment explaining why it
        # does not apply.
        run: uv run pip-audit

      - name: Security scan with Bandit
        run: uv run bandit -r src/officeclaw/ -ll -ii

      - name: Check for secrets in code
        # Pinned to a commit SHA: @main is a mutable ref and would run
        # whatever lands upstream with access to this workflow's context.
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          extra_args: --only-verified

  # ============================================
  # UNIT TESTS
  # ============================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          # For keyring on Linux
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src/officeclaw \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ============================================
  # BUILD VERIFICATION
  # ============================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================
  # INTEGRATION TESTS (Optional, manual trigger)
  # ============================================
  # Runs only on manual dispatch. Note that these tests need a *cached token*
  # (~/.officeclaw/token_cache.json), which device code flow cannot produce
  # non-interactively — so in CI they skip rather than run. Treat a green run
  # here as "nothing broke", not as "the live path was verified"; run
  # `uv run pytest -m integration` locally after `officeclaw auth login` for that.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          OFFICECLAW_CLIENT_ID: ${{ secrets.OFFICECLAW_CLIENT_ID }}
          OFFICECLAW_CLIENT_SECRET: ${{ secrets.OFFICECLAW_CLIENT_SECRET }}
        run: |
          pytest tests/ -m integration -v
        if: env.OFFICECLAW_CLIENT_ID != ''
